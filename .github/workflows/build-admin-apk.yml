name: Build GFP Admin APK (private)

# Owner-only app. The APK is NEVER delivered to the website - it is kept as
# a private GitHub artifact that only the repo owner can download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gfp-admin/**'
      - '.github/workflows/build-admin-apk.yml'

concurrency:
  group: build-admin-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gfp-admin/package.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gfp-admin/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: gfp-admin
        run: npm install

      - name: Generate app icons
        working-directory: gfp-admin
        run: node scripts/icons.js

      - name: Set versionCode from run number
        working-directory: gfp-admin
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json','utf8'));
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2));
          "

      - name: Generate native Android project
        working-directory: gfp-admin
        run: npx expo prebuild --platform android --no-install

      - name: Use persistent release keystore
        run: cp release.keystore gfp-admin/android/app/debug.keystore

      - name: Build release APK
        working-directory: gfp-admin/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect artifact
        run: cp gfp-admin/android/app/build/outputs/apk/release/app-release.apk GFP-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GFP-Admin-APK
          path: GFP-Admin.apk
          retention-days: 30
